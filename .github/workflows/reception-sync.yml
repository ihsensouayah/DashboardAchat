name: Synchro Odoo -> Reception BC (toutes les 2h)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 9,11,13,15,17 * * 1-6"
concurrency:
  group: odoo-sync
  cancel-in-progress: false

jobs:
  reception:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r odoo-agent/requirements.txt
      - name: Synchroniser Reception BC
        working-directory: odoo-agent
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          FIREBASE_RECEPTION_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_RECEPTION_SERVICE_ACCOUNT }}
        run: python odoo_sync.py --reception-only
